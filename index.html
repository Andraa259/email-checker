<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BluePulse - High Speed Email Verifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
              950: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Background Colorful Glowing Orbs -->
  <div class="absolute top-10 -left-20 w-96 h-96 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 -right-20 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <main class="w-full max-w-2xl bg-slate-900/80 backdrop-blur-xl p-6 md:p-8 rounded-3xl border border-blue-500/30 shadow-2xl shadow-blue-500/10 relative z-10">
    
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-semibold uppercase tracking-wider mb-3">
        ⚡ High-Speed Engine
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-400">
        BluePulse Verifier
      </h1>
      <p class="text-slate-400 text-sm mt-1">Cek keaktifan email single maupun bulk (hingga ribuan email)</p>
    </header>

    <!-- Form Input -->
    <form id="checkerForm" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-blue-300 mb-2">
          Daftar Email (1 email per baris)
        </label>
        <textarea 
          id="emailsInput" 
          rows="5"
          placeholder="contoh1@gmail.com&#10;contoh2@yahoo.com&#10;contoh3@outlook.com"
          required
          class="w-full p-4 bg-slate-950/70 border border-slate-700/80 rounded-2xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all placeholder:text-slate-600 font-mono resize-y"
        ></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-blue-300 mb-2">Mode Engine</label>
          <select 
            id="modeSelect"
            class="w-full p-3.5 bg-slate-950/70 border border-slate-700/80 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition-all cursor-pointer"
          >
            <option value="fast">⚡ Fast Check (Super Cepat)</option>
            <option value="deep">🔍 Deep Check (Pemeriksaan Mendalam)</option>
          </select>
        </div>

        <div class="flex items-end">
          <button 
            type="submit" 
            id="submitBtn"
            class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 active:scale-[0.98] text-white font-bold p-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
          >
            <span>Mulai Verifikasi</span>
          </button>
        </div>
      </div>
    </form>

    <!-- Stat Dashboard (Muncul saat ada hasil) -->
    <div id="statsBox" class="mt-8 hidden grid grid-cols-3 gap-3">
      <div class="bg-blue-950/40 border border-blue-500/30 p-3 rounded-2xl text-center">
        <span class="block text-xs text-blue-300 font-medium">Total</span>
        <span id="statTotal" class="text-xl font-bold text-white">0</span>
      </div>
      <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-2xl text-center">
        <span class="block text-xs text-emerald-300 font-medium">Valid / Live</span>
        <span id="statValid" class="text-xl font-bold text-emerald-400">0</span>
      </div>
      <div class="bg-rose-950/40 border border-rose-500/30 p-3 rounded-2xl text-center">
        <span class="block text-xs text-rose-300 font-medium">Invalid / Bad</span>
        <span id="statInvalid" class="text-xl font-bold text-rose-400">0</span>
      </div>
    </div>

    <!-- Output Box -->
    <div id="resultBox" class="mt-6 hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Detail Response JSON</span>
        <button id="copyBtn" class="text-xs text-blue-400 hover:text-blue-300 underline cursor-pointer">Salin Hasil</button>
      </div>
      <pre id="jsonOutput" class="p-4 bg-slate-950 rounded-2xl border border-slate-800 text-xs font-mono text-cyan-300 max-h-60 overflow-y-auto leading-relaxed"></pre>
    </div>

    <!-- Error Alert -->
    <div id="errorBox" class="mt-4 hidden p-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-2xl text-xs font-medium"></div>

  </main>

  <script>
    const form = document.getElementById('checkerForm');
    const emailsInput = document.getElementById('emailsInput');
    const modeSelect = document.getElementById('modeSelect');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');
    const errorBox = document.getElementById('errorBox');
    const jsonOutput = document.getElementById('jsonOutput');
    const statsBox = document.getElementById('statsBox');
    const statTotal = document.getElementById('statTotal');
    const statValid = document.getElementById('statValid');
    const statInvalid = document.getElementById('statInvalid');
    const copyBtn = document.getElementById('copyBtn');

    let currentResponseData = null;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Olah input teks textarea menjadi Array email
      const rawText = emailsInput.value;
      const emails = rawText.split('\n').map(e => e.trim()).filter(e => e.length > 0);

      if (emails.length === 0) {
        showError('Masukkan minimal 1 alamat email.');
        return;
      }

      // Reset State UI
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      statsBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Memeriksa (${emails.length} Email)...</span>
      `;

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emails, mode: modeSelect.value })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Gagal memproses request');
        }

        currentResponseData = result.data;
        jsonOutput.innerText = JSON.stringify(result.data, null, 2);

        // Hitung Statistik
        calculateStats(result.data, emails.length);

        resultBox.classList.remove('hidden');
        statsBox.classList.remove('hidden');
      } catch (err) {
        showError(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Mulai Verifikasi</span>`;
      }
    });

    function calculateStats(data, totalInput) {
      let valid = 0;
      let invalid = 0;

      if (Array.isArray(data)) {
        data.forEach(item => {
          const status = (item.status || Object.values(item)[0] || '').toString().toLowerCase();
          if (status === 'good' || status === 'live') valid++;
          else invalid++;
        });
      }

      statTotal.innerText = totalInput;
      statValid.innerText = valid;
      statInvalid.innerText = invalid;
    }

    function showError(msg) {
      errorBox.innerText = '⚠️ ' + msg;
      errorBox.classList.remove('hidden');
    }

    copyBtn.addEventListener('click', () => {
      if (currentResponseData) {
        navigator.clipboard.writeText(JSON.stringify(currentResponseData, null, 2));
        alert('Hasil berhasil disalin ke clipboard!');
      }
    });
  </script>
</body>
</html>
